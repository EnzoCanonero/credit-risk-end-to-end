# Defines the package, dependencies, and build settings.
[project]
name = "credit-risk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "pandas",
    "numpy",
    "scikit-learn",
    "lightgbm",
    "matplotlib",
    "optuna",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "jupyterlab",
    "ipykernel",
    "mypy<2",
    "pytest",
    "httpx",
    "ruff",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src/credit_risk", "app", "scripts", "tests"]
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]
explicit_package_bases = true
